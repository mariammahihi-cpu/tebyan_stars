<!-- students/templates/students/edit_student.html -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تعديل بيانات طالب - نجوم التبيان</title>
</head>
<body>
    <main class="edit-page">
        <h1>تعديل: {{ object }}</h1>

        {% if form.non_field_errors %}
            <div class="form-errors">
                {% for error in form.non_field_errors %}<p>{{ error }}</p>{% endfor %}
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-field">
                    {{ field.label_tag }}
                    {{ field }}
                    {% for error in field.errors %}<p class="field-error">{{ error }}</p>{% endfor %}
                </div>
            {% endfor %}
            <button type="submit">حفظ التعديل</button>
        </form>

        <p><a href="{% url 'students:manage_students' %}">رجوع لقائمة الطلاب</a></p>
    </main>
</body>
</html>
