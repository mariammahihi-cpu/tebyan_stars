            <table>
                <thead>
                    <tr><th style="width: 28px;">#</th><th>اسم الطالب</th><th style="text-align:left;">الرصيد</th></tr>
                </thead>
                <tbody>
                    {% for row in rows %}
                        <tr>
                            <td><span class="lb-rank {% if forloop.counter == 1 %}top1{% elif forloop.counter == 2 %}top2{% elif forloop.counter == 3 %}top3{% endif %}">{{ forloop.counter }}</span></td>
                            <td>{{ row.student.full_name }}</td>
                            <td style="text-align:left;" class="{% if row.value < 0 %}value-deduct{% else %}value-add{% endif %}">{{ row.value }}</td>
                        </tr>
                    {% empty %}
                        <tr><td colspan="3" class="empty-note">لا يوجد طلاب نشطون بهذا الفصل</td></tr>
                    {% endfor %}
                </tbody>
            </table>
