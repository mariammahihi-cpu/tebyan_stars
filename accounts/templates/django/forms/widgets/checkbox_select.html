{% with id=widget.attrs.id %}<div{% if id %} id="{{ id }}"{% endif %} class="grid grid-cols-2 sm:grid-cols-3 gap-2 p-3 rounded-lg border border-brand-light bg-brand-bg/30 max-h-44 overflow-y-auto">{% for group, options, index in widget.optgroups %}{% if group %}
    <div class="col-span-full text-xs font-semibold text-slate-500">{{ group }}</div>{% endif %}{% for option in options %}{% include option.template_name with widget=option %}{% endfor %}{% endfor %}
</div>{% endwith %}
